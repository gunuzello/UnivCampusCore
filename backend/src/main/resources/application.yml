spring:
  application:
    name: ucc
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ucc}
    username: ${DB_USERNAME:ucc}
    password: ${DB_PASSWORD:ucc_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
