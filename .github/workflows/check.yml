name: UCC 검증
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ucc_test
          POSTGRES_USER: ucc
          POSTGRES_PASSWORD: ucc_ci_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ucc -d ucc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 실제 PostgreSQL 기반 백엔드 테스트
        working-directory: backend
        run: ./mvnw --batch-mode test
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/ucc_test
          DB_USERNAME: ucc
          DB_PASSWORD: ucc_ci_only
      - name: 프론트엔드 타입 검사와 빌드
        working-directory: frontend
        run: npm ci && npm run build
